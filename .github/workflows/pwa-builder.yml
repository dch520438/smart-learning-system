name: PWA Builder Package

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWA Builder CLI
        run: npm install -g @pwabuilder/cli

      - name: Build PWA packages
        run: |
          pwabuilder build https://dch520438.github.io/smart-learning-system/ --platforms=windows,android,apple

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: pwa-packages
          path: ./pwabuilder
