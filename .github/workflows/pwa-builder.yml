# 智慧学习系统 - 无交互稳定版APK自动打包
name: 智慧学习系统APK自动打包

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      # 配置Java JDK并全局设置JAVA_HOME环境变量
      - name: 配置Java JDK 17环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        id: java_setup

      # 配置Node.js环境
      - name: 配置Node.js 20环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 前置校验：确认manifest文件可正常访问（避免后续打包失败）
      - name: 校验manifest文件可用性
        run: |
          curl -f https://dch520438.github.io/smart-learning-system/manifest.webmanifest
          echo "manifest文件校验通过"

      # 安装项目依赖并构建生产版本
      - name: 安装项目依赖
        run: npm install
      - name: 构建生产版本
        run: npm run build

      # 安装Bubblewrap CLI
      - name: 安装Bubblewrap打包工具
        run: npm install -g @bubblewrap/cli

      # 核心修复：无交互初始化打包配置，自动应答所有提问，强制使用已安装的JDK
      - name: 初始化APK打包配置
        run: |
          # 全局设置JAVA_HOME，让Bubblewrap直接识别已安装的JDK
          export JAVA_HOME=${{ steps.java_setup.outputs.path }}
          # 创建打包目录
          mkdir -p ./apk-build
          # 用yes命令自动应答所有交互式提问，输入No拒绝安装JDK，强制使用现有环境
          yes "No" | bubblewrap init \
            --manifest=https://dch520438.github.io/smart-learning-system/manifest.webmanifest \
            --directory=./apk-build
        env:
          CI: true

      # 无交互执行打包，生成APK
      - name: 构建生成安卓APK
        run: |
          export JAVA_HOME=${{ steps.java_setup.outputs.path }}
          bubblewrap build \
            --directory=./apk-build \
            --skipSigningValidation
        env:
          CI: true

      # 上传最终APK安装包
      - name: 上传APK安装包
        uses: actions/upload-artifact@v4
        with:
          name: 智慧学习系统-安卓APK安装包
          path: ./apk-build/*.apk
