# 智慧学习系统 - Google官方Bubblewrap CLI 自动打包APK
name: 智慧学习系统APK自动打包

# 触发规则：推送main分支自动打包，同时支持手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 权限配置（必须保留，否则无法上传打包产物）
permissions:
  contents: read
  packages: write

jobs:
  build-and-pack-apk:
    # GitHub自带免费云端运行环境
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取你仓库的最新代码
      - name: 检出项目代码
        uses: actions/checkout@v4

      # 步骤2：配置Node.js环境（和你的项目版本匹配）
      - name: 配置Node.js 20环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 步骤3：安装项目依赖，构建最新生产版本（确保打包的是最新代码）
      - name: 安装项目依赖
        run: npm install
      - name: 构建生产版本
        run: npm run build

      # 步骤4：配置Java环境（Bubblewrap打包必须依赖）
      - name: 配置Java JDK 17环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 步骤5：安装Google官方Bubblewrap CLI打包工具
      - name: 安装Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # 步骤6：初始化打包配置，自动读取你的PWA manifest文件
      - name: 初始化APK打包配置
        run: |
          bubblewrap init --manifest=https://dch520438.github.io/smart-learning-system/manifest.webmanifest --directory=./apk-build
        env:
          CI: true # 禁用交互式输入，自动使用默认配置

      # 步骤7：执行打包，生成可直接安装的APK
      - name: 构建生成安卓APK
        run: |
          bubblewrap build --directory=./apk-build
        env:
          CI: true

      # 步骤8：上传打包好的APK，供你下载
      - name: 上传APK安装包
        uses: actions/upload-artifact@v4
        with:
          name: 智慧学习系统-安卓APK安装包
          path: ./apk-build/app-release-signed.apk
