# 智慧学习系统 - Google官方Bubblewrap CLI 自动打包APK
name: 智慧学习系统APK自动打包

# 触发规则：推送main分支自动打包，同时支持手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 权限配置
permissions:
  contents: read
  packages: write

jobs:
  build-and-pack-apk:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取项目代码
      - name: 检出项目代码
        uses: actions/checkout@v4

      # 步骤2：配置Node.js环境
      - name: 配置Node.js 20环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 步骤3：配置Java JDK环境，记录JAVA_HOME路径
      - name: 配置Java JDK 17环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        id: java_setup

      # 步骤4：安装项目依赖，构建生产版本
      - name: 安装项目依赖
        run: npm install
      - name: 构建生产版本
        run: npm run build

      # 步骤5：安装Google官方Bubblewrap CLI打包工具
      - name: 安装Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # 步骤6：初始化打包配置（强制非交互模式，彻底解决交互阻塞）
      - name: 初始化APK打包配置
        run: |
          mkdir -p ./apk-build
          bubblewrap init \
            --manifest=https://dch520438.github.io/smart-learning-system/manifest.webmanifest \
            --directory=./apk-build \
            --nonInteractive \
            --jdkPath=${{ steps.java_setup.outputs.path }}
        env:
          CI: true

      # 步骤7：执行打包，生成可安装的APK
      - name: 构建生成安卓APK
        run: |
          bubblewrap build \
            --directory=./apk-build \
            --nonInteractive
        env:
          CI: true

      # 步骤8：上传打包好的APK安装包
      - name: 上传APK安装包
        uses: actions/upload-artifact@v4
        with:
          name: 智慧学习系统-安卓APK安装包
          path: ./apk-build/app-release-signed.apk
