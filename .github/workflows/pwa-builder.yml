name: PWA Builder Package
on:
  # 仅手动触发，避免自动运行
  workflow_dispatch:

jobs:
  build-pwa:
    runs-on: ubuntu-latest
    steps:
      # 配置兼容的Node.js LTS版本
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          check-latest: true

      # 使用官方正确的pwabuilder包执行打包，彻底解决参数不识别问题
      - name: Build PWA Packages
        run: |
          npx pwabuilder@latest build \
            "https://dch520438.github.io/smart-learning-system/" \
            --platforms windows,android \
            --output ./pwabuilder

      # 上传打包产物（无论是否成功都上传，方便排查）
      - name: Upload PWA Build Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-install-packages
          path: ./pwabuilder
