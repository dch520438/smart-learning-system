# 智慧学习系统 安卓APK稳定打包工作流
name: 智慧学习系统APK自动打包
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      - name: 配置Java JDK 17环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        id: java_setup

      - name: 配置Node.js 20环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 校验站点可用性
        run: |
          curl -f https://dch520438.github.io/smart-learning-system/
          curl -f https://dch520438.github.io/smart-learning-system/manifest.webmanifest
          curl -f https://dch520438.github.io/smart-learning-system/pwa-192x192.png
          curl -f https://dch520438.github.io/smart-learning-system/pwa-512x512.png
          echo "站点、manifest、图标校验全部通过"

      - name: 安装项目依赖
        run: npm install
      - name: 构建生产版本
        run: npm run build

      - name: 安装Bubblewrap打包工具
        run: npm install -g @bubblewrap/cli

      - name: 构建安卓APK
        run: |
          export JAVA_HOME=${{ steps.java_setup.outputs.path }}
          export PATH=$JAVA_HOME/bin:$PATH
          java -version
          mkdir -p ./apk-build
          
          cat > ./apk-build/twa-manifest.json << 'EOF'
          {
            "packageId": "io.github.dch520438.smartlearning",
            "name": "智慧学习系统",
            "launcherName": "智慧学习",
            "display": "standalone",
            "themeColor": "#2563eb",
            "navigationColor": "#000000",
            "backgroundColor": "#f0f5ff",
            "enableNotifications": false,
            "startUrl": "https://dch520438.github.io/smart-learning-system/",
            "host": "dch520438.github.io",
            "path": "/smart-learning-system/",
            "deepLinks": [],
            "fallbackType": "customtabs",
            "webManifestUrl": "https://dch520438.github.io/smart-learning-system/manifest.webmanifest",
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "minSdkVersion": 24,
            "targetSdkVersion": 33,
            "compileSdkVersion": 33,
            "buildToolsVersion": "33.0.0",
            "supportLibrary": "androidx.appcompat:appcompat:1.6.1",
            "androidxBrowser": "androidx.browser:browser:1.5.0",
            "signatureType": "debug",
            "permissions": [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.INTERNET"
            ],
            "features": [
              "android.hardware.camera",
              "android.hardware.microphone"
            ],
            "orientation": "fullSensor",
            "siteUrl": "https://dch520438.github.io/smart-learning-system/",
            "icons": [
              {
                "src": "pwa-192x192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "pwa-512x512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "maskable-icon.png",
                "sizes": "1024x1024",
                "type": "image/png",
                "purpose": "maskable"
              }
            ]
          }
          EOF
          
          bubblewrap build \
            --directory=./apk-build \
            --skipValidation \
            --skipSigningValidation

      - name: 上传APK安装包
        uses: actions/upload-artifact@v4
        with:
          name: 智慧学习系统-安卓APK安装包
          path: ./apk-build/*.apk
