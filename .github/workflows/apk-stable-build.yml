# 智慧学习系统 安卓APK终极稳定打包工作流
name: 智慧学习系统APK自动打包
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      # 配置Java JDK 17，提前写入全局环境变量
      - name: 配置Java JDK 17环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        id: java_setup

      # 配置Node.js 20环境
      - name: 配置Node.js 20环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 前置校验：确认站点、manifest、图标全部可正常访问
      - name: 校验站点可用性
        run: |
          curl -f https://dch520438.github.io/smart-learning-system/
          curl -f https://dch520438.github.io/smart-learning-system/manifest.webmanifest
          curl -f https://dch520438.github.io/smart-learning-system/pwa-192x192.png
          curl -f https://dch520438.github.io/smart-learning-system/pwa-512x512.png
          echo "✅ 站点、manifest、图标校验全部通过"

      # 安装项目依赖，构建最新生产版本
      - name: 安装项目依赖
        run: npm install
      - name: 构建生产版本
        run: npm run build

      # 安装固定稳定版Bubblewrap CLI，避免最新版兼容性问题
      - name: 安装稳定版Bubblewrap打包工具
        run: npm install -g @bubblewrap/cli@1.21.0

      # 核心修复：彻底绕开所有交互式提问，强制自动应答所有确认项
      - name: 构建安卓APK
        run: |
          # 全局写入JAVA_HOME，让Bubblewrap强制识别已安装的JDK
          export JAVA_HOME=${{ steps.java_setup.outputs.path }}
          export PATH=$JAVA_HOME/bin:$PATH
          
          # 验证JDK可用
          java -version
          
          # 创建打包目录
          mkdir -p ./apk-build
          
          # 预生成完整的TWA配置文件，完全跳过init命令，从根源避免交互
          cat > ./apk-build/twa-manifest.json << 'EOF'
          {
            "packageId": "io.github.dch520438.smartlearning",
            "name": "智慧学习系统",
            "launcherName": "智慧学习",
            "display": "standalone",
            "themeColor": "#2563eb",
            "navigationColor": "#000000",
            "backgroundColor": "#f0f5ff",
            "enableNotifications": false,
            "startUrl": "https://dch520438.github.io/smart-learning-system/",
            "host": "dch520438.github.io",
            "path": "/smart-learning-system/",
            "deepLinks": [],
            "fallbackType": "customtabs",
            "webManifestUrl": "https://dch520438.github.io/smart-learning-system/manifest.webmanifest",
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "minSdkVersion": 24,
            "targetSdkVersion": 33,
            "compileSdkVersion": 33,
            "buildToolsVersion": "33.0.0",
            "supportLibrary": "androidx.appcompat:appcompat:1.6.1",
            "androidxBrowser": "androidx.browser:browser:1.5.0",
            "signatureType": "debug",
            "permissions": [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.INTERNET"
            ],
            "features": [
              "android.hardware.camera",
              "android.hardware.microphone"
            ],
            "orientation": "fullSensor",
            "siteUrl": "https://dch520438.github.io/smart-learning-system/",
            "icons": [
              {
                "src": "pwa-192x192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "pwa-512x512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "maskable-icon.png",
                "sizes": "1024x1024",
                "type": "image/png",
                "purpose": "maskable"
              }
            ]
          }
          EOF
          
          # 核心修复：用yes命令强制给所有交互式提问自动应答"No"，彻底解决卡死问题
          # 同时添加--nonInteractive参数，强制禁用所有交互
          yes "No" | bubblewrap build \
            --directory=./apk-build \
            --nonInteractive \
            --skipValidation \
            --skipSigningValidation

      # 上传打包完成的APK安装包
      - name: 上传APK安装包
        uses: actions/upload-artifact@v4
        with:
          name: 智慧学习系统-安卓APK安装包
          path: ./apk-build/*.apk
