# 智慧学习系统 PWA Builder官方稳定版APK打包工作流
name: 智慧学习系统APK自动打包
on:
  # 推送main分支自动打包
  push:
    branches: [ main ]
  # 支持手动触发打包
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      # 配置Node.js环境
      - name: 配置Node.js 20环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 前置校验：站点、manifest、图标可正常访问
      - name: 校验站点可用性
        run: |
          curl -f https://dch520438.github.io/smart-learning-system/
          curl -f https://dch520438.github.io/smart-learning-system/manifest.webmanifest
          curl -f https://dch520438.github.io/smart-learning-system/pwa-192x192.png
          echo "✅ 站点校验通过"

      # 安装依赖，构建生产版本
      - name: 安装项目依赖
        run: npm install
      - name: 构建生产版本
        run: npm run build

      # 核心：PWA Builder官方打包Action，完全无交互，自动处理所有环境和配置
      - name: PWA官方打包生成安卓APK
        uses: pwa-builder/pwabuilder-gh-action@main
        with:
          # 你的站点地址
          siteUrl: https://dch520438.github.io/smart-learning-system/
          # 安卓包名
          appId: io.github.dch520438.smartlearning
          # 应用名称
          appName: 智慧学习系统
          # 应用版本号
          appVersion: 1.0.0
          # 安卓内部版本号
          versionCode: 1
          # 最低安卓版本
          minSdkVersion: 24
          # 屏幕方向，适配手机/平板自动旋转
          screenOrientation: fullSensor
          # 声明权限，确保拍照、语音功能正常
          permissions: CAMERA,RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,INTERNET

      # 上传打包好的APK安装包
      - name: 上传APK安装包
        uses: actions/upload-artifact@v4
        with:
          name: 智慧学习系统-安卓APK安装包
          path: ./output
